
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tear Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Tear Virtual</h1>
        <p>Selecione as células que pretende ativar.</p>

        <div class="matrix-scroll">
            <div id="controls" class="controls"></div>
            <div id="matrix" class="matrix"></div>
        </div>

        <button id="clearButton" type="button">
            Limpar matriz
        </button>
        <button id="expandButton" type="button">
            Expandir
        </button>

        <div class="matrix-scroll">
            <div id="numberMatrix" class="number-matrix"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
